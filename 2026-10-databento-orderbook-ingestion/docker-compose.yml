services:
  questdb:
    image: questdb/questdb:10.0.1
    container_name: questdb-databento
    restart: unless-stopped
    ports:
      - "9000:9000" # Web console, REST, and QWP over WebSocket
      - "8812:8812" # PostgreSQL wire protocol
    volumes:
      - questdb-databento-data:/var/lib/questdb

volumes:
  questdb-databento-data:
